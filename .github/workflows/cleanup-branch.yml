on:
  schedule:
  - cron: "0 0 * * 5"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const days = 7;
            const cutoff = new Date(Date.now() - days*24*60*60*1000);

            const branches = await github.paginate(github.reset.repos.listBranches, { owner, repo });

            for (const branch of branches){
              if(branch.name === 'main' || branch.name ==='dev') continue;

              const commits = await github.rest.repos.listCommits({
                owner,
                repo,
                sha: branch.name,
                per_page: 1
              })

              const lastCommitDate = new Date(commits.data[0].commit.committer.date);

              if(lastCommitDate < cutoff ) {
                console.log(`Deleting ${branch.name}`);
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`
                })
              }
            }
